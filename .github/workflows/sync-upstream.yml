name: Sync Upstream & Update Custom Branch

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream to Custom Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: custom-main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream to upstream-main branch
        run: |
          git remote add upstream https://github.com/NIAnup/live_activity_kit.git || true
          git fetch upstream
          # 1. Update pure mirror branch upstream-main to 100% match official repository
          git checkout -B upstream-main upstream/main
          git push origin upstream-main --force

      - name: Safely merge upstream into custom-main
        run: |
          # 2. Switch back to your custom branch and merge official changes safely
          git checkout custom-main
          git merge upstream-main -m "chore: merge upstream updates into custom-main"
          # 3. Push your updated custom branch
          git push origin custom-main
