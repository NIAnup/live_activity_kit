name: live_activity_kit_example
description: Four end-to-end Live Activity demos built with live_activity_kit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The constraint a real user would write, so the example doubles as copyable
  # documentation.
  live_activity_kit: ^1.0.0

# Resolve that constraint against this repository rather than pub.dev.
#
# Without the override the example cannot resolve at all until 1.0.0 is
# published, and once it is, the example would silently build against the
# released archive instead of the working tree — so a regression introduced here
# would not show up until after it shipped.
dependency_overrides:
  live_activity_kit:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
