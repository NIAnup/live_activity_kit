name: live_activity_kit
description: >-
  Build iOS Live Activities and Dynamic Island widgets from Dart. Component DSL,
  SwiftUI renderer, ActivityKit, App Groups and APNs push updates — no Swift code.
version: 0.1.0
repository: https://github.com/NIAnup/live_activity_kit
issue_tracker: https://github.com/NIAnup/live_activity_kit/issues
topics:
  - live-activities
  - dynamic-island
  - activitykit
  - ios
  - widgets

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.6.0
  path: ^1.9.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiveActivityKitPlugin
        sharedDarwinSource: false

# `dart run live_activity_kit:setup` resolves to bin/setup.dart
executables:
  setup: setup
