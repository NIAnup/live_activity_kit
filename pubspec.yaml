name: live_activity_kit
description: >-
  A universal, component-based framework for building iOS Live Activities and
  Dynamic Island experiences entirely from Dart. Declare the UI with a Flutter-like
  DSL, ship it as a JSON layout tree, and let a bundled SwiftUI renderer draw it.
version: 0.1.0
repository: https://github.com/NIAnup/live_activity_kit
issue_tracker: https://github.com/NIAnup/live_activity_kit/issues
topics:
  - live-activities
  - dynamic-island
  - activitykit
  - ios
  - widgets

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.6.0
  path: ^1.9.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiveActivityKitPlugin
        sharedDarwinSource: false

# `dart run live_activity_kit:setup` resolves to bin/setup.dart
executables:
  setup: setup
